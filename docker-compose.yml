
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: voice_db
      POSTGRES_USER: voice_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voice_app -d voice_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  voice_service:
    build: ./src/voice_service
    environment:
      DATABASE_URL: postgresql://voice_app:${POSTGRES_PASSWORD}@postgres:5432/voice_db
      MODEL_VERSION: ${MODEL_VERSION:-speaker-model-v1}
      IDENTIFICATION_THRESHOLD: ${IDENTIFICATION_THRESHOLD:-0.80}
      DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-1}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    
  diarization_service:
    build: ./src/diarization_service
    command: uvicorn diarization_service.main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      HF_TOKEN: ${HF_TOKEN:?Set HF_TOKEN in .env}
      HF_HOME: /models
      TORCH_HOME: /models
      VOICE_SERVICE_URL: http://voice_service:8000
      IDENTIFICATION_THRESHOLD: "0.80"
      USE_GPU: "false"
      MIN_SEGMENT_DURATION: "0.5"
      MAX_UPLOAD_SIZE_MB: "500"
    depends_on:
      voice_service:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - ./models:/models
      - ./test.wav:/tmp/test.wav:ro
      - ./src/diarization_service:/app/diarization_service
      - /app/diarization_service/.venv
    restart: unless-stopped
volumes:
  postgres_data:
