[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "diarization-service"
version = "1.0.0"
description = "Диаризация аудиозаписей и идентификация спикеров"
authors = [
    {name = "Artyom Denisov", email = "artem_denisov_2005@inbox.ru"}
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "python-multipart (>=0.0.9,<1.0.0)",
    "httpx (>=0.27,<1.0.0)",
    "numpy (>=1.26,<3.0.0)",
    "pyannote-audio (>=4.0.7,<5.0.0)",
    "torch (>=2.15.0,<3.0.0)",
    "torchaudio (>=2.11.1,<3.0.0)",
]

[tool.setuptools.packages.find]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.dependencies]
torch = { version = ">=2.15.0,<3.0.0", source = "pytorch-cpu" }
torchaudio = { version = ">=2.11.1,<3.0.0", source = "pytorch-cpu" }